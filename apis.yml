  contemporary womenswear — denim, bottoms, tops, t-shirts, dresses, co-ords, jumpsuits, bodysuits
  and winterwear — through its website and iOS/Android shopping apps, backed by a growing footprint
  of physical retail stores across India and Asia. Newme is a consumer direct-to-consumer retailer
  and, as of this profile, publishes no public developer API, documentation, or developer portal;
  it is tracked in the API Evangelist network as a company profile.'
